[package]
name = "icondocs"
version = "0.1.0"
edition = "2021"
description = "Lightweight Fences-style desktop icon organizer (Win32, no runtime)"

[dependencies.windows-sys]
version = "0.59"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_Storage_FileSystem",
  "Win32_UI_Controls",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# 실행 파일에 매니페스트를 넣는다(외부 리소스 컴파일러 없이 COFF 오브젝트 생성). 런타임 의존성 아님.
# Windows 8+ 호환 선언이 없으면 레이어드 "자식" 창의 투명도가 무시된다.
[build-dependencies]
embed-manifest = "1.4"
